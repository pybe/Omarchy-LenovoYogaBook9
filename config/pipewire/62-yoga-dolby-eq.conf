# Lenovo Yoga Book 9 13IRU8: the speaker correction Windows applies.
#
# Extracted from Lenovo's own audio driver package, file
#   Dolby/ext_lenovo_AIO_rtk/DEV_0287_SUBSYS_17AA3881_PCI_SUBSYS_384317AA.xml
# which matches this machine on all three IDs: DEV_0287 (ALC287),
# SUBSYS_17AA3881 (codec) and PCI_SUBSYS_384317AA (PCI SSID 17aa:3843).
#
# This is the "stand" operating mode, "music" profile -- Dolby ships a
# different curve per physical position, matching the modes yoga-mode knows.
#
#   high-shelf 1600 Hz  +5.00 dB  S=1.0
#   peaking    2500 Hz  -5.00 dB  Q=1.5
#   peaking    1500 Hz  +6.00 dB  Q=3.5
#   peaking     500 Hz  +3.00 dB  Q=0.5
#
# Filter types are evidenced, not guessed: type=1 carries q in all 340
# instances in the file, type=3 carries s in all 90 and appears only at
# 1500-1600 Hz (a low shelf there would lift most of the audible band).
# Dolby's shelf slope S converts to the biquad Q by
#   1/Q^2 = (A + 1/A)(1/S - 1) + 2,  so S=1 -> Q = 1/sqrt(2) = 0.7071.
#
# PRE-ATTENUATION: Dolby applies pregain=0/postgain=0 and relies on its
# regulator (a limiter with speaker-distortion modelling) to absorb peaks that
# reach +9 dB. PipeWire has no equivalent, so the boost is paid for up front
# instead: -6 dB in via a mixer node (linear does not expose a gain control in
# this build), raise the hardware volume to compensate. Without this the
# chain clips on anything dense, which is how the JamesDSP attempt went wrong.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers (Dolby stand)"
            media.name       = "Speakers (Dolby stand)"
            filter.graph = {
                nodes = [
                    { type = builtin name = trimL label = mixer        control = { "Gain 1" = 0.7079 } }
                    { type = builtin name = trimR label = mixer        control = { "Gain 1" = 0.7079 } }
                    { type = builtin name = shL   label = bq_highshelf control = { "Freq" = 1600 "Q" = 0.7071 "Gain" =  1.0 } }
                    { type = builtin name = shR   label = bq_highshelf control = { "Freq" = 1600 "Q" = 0.7071 "Gain" =  1.0 } }
                    { type = builtin name = p1L   label = bq_peaking   control = { "Freq" = 2500 "Q" = 1.5    "Gain" = -5.0 } }
                    { type = builtin name = p1R   label = bq_peaking   control = { "Freq" = 2500 "Q" = 1.5    "Gain" = -5.0 } }
                    { type = builtin name = p2L   label = bq_peaking   control = { "Freq" = 1500 "Q" = 2.0    "Gain" =  7.0 } }
                    { type = builtin name = p2R   label = bq_peaking   control = { "Freq" = 1500 "Q" = 2.0    "Gain" =  7.0 } }
                    { type = builtin name = p3L   label = bq_peaking   control = { "Freq" =  500 "Q" = 0.5    "Gain" =  4.5 } }
                    { type = builtin name = bassL label = bq_lowshelf  control = { "Freq" =  300 "Q" = 0.7071 "Gain" =  9.0 } }
                    { type = builtin name = p3R   label = bq_peaking   control = { "Freq" =  500 "Q" = 0.5    "Gain" =  4.5 } }
                    { type = builtin name = bassR label = bq_lowshelf  control = { "Freq" =  300 "Q" = 0.7071 "Gain" =  9.0 } }
                ]
                links = [
                    { output = "trimL:Out" input = "shL:In" }
                    { output = "shL:Out"   input = "p1L:In" }
                    { output = "p1L:Out"   input = "p2L:In" }
                    { output = "p2L:Out"   input = "p3L:In" }
                    { output = "p3L:Out"   input = "bassL:In" }
                    { output = "trimR:Out" input = "shR:In" }
                    { output = "shR:Out"   input = "p1R:In" }
                    { output = "p1R:Out"   input = "p2R:In" }
                    { output = "p2R:Out"   input = "p3R:In" }
                    { output = "p3R:Out"   input = "bassR:In" }
                ]
                inputs  = [ "trimL:In 1" "trimR:In 1" ]
                outputs = [ "bassL:Out" "bassR:Out" ]
            }
            capture.props = {
                node.name      = "yoga_dolby"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "yoga_dolby_out"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
                target.object  = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
            }
        }
    }
]

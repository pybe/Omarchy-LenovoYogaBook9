# Lenovo Yoga Book 9 13IRU8: always-on tone correction for the internal speakers.
#
# Small drivers in a thin chassis sound light even once the woofers are fed
# (see the WirePlumber 4-channel rule). This applies a fixed low shelf plus a
# slight upper-mid trim using PipeWire's built-in biquad filters. No external
# plugins, no application to keep running, loaded automatically at startup.
#
# To change the amount, edit the Gain values below and restart PipeWire:
#   systemctl --user restart pipewire pipewire-pulse wireplumber
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers"
            media.name       = "Speakers"
            filter.graph = {
                nodes = [
                    { type = builtin name = bassL label = bq_lowshelf control = { Freq = 160 Q = 0.7 Gain = 6.5 } }
                    { type = builtin name = bassR label = bq_lowshelf control = { Freq = 160 Q = 0.7 Gain = 6.5 } }
                    { type = builtin name = midL  label = bq_peaking  control = { Freq = 2500 Q = 1.0 Gain = -2.0 } }
                    { type = builtin name = midR  label = bq_peaking  control = { Freq = 2500 Q = 1.0 Gain = -2.0 } }
                ]
                links = [
                    { output = "bassL:Out" input = "midL:In" }
                    { output = "bassR:Out" input = "midR:In" }
                ]
                inputs  = [ "bassL:In" "bassR:In" ]
                outputs = [ "midL:Out" "midR:Out" ]
            }
            capture.props = {
                node.name      = "bass_boost_sink"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "bass_boost_output"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
                target.object  = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
            }
        }
    }
]

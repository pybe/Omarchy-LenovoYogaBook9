# Lenovo Yoga Book 9 13IRU8 (82YQ): the upper panel (eDP-1) is physically
# mounted 180 degrees out and there is no kernel DRM quirk for this model, so
# the kernel reports "Normal" and everything before the compositor renders
# upside down -- the plymouth splash and the LUKS passphrase prompt included.
# Telling the kernel the true orientation fixes those.
KERNEL_CMDLINE[default]+=" video=eDP-1:panel_orientation=upside_down"

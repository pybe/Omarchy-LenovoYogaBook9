# Lenovo Yoga Book 9 13IRU8: never close the speaker PCM.
#
# The TAS2781 amp driver runs a shutdown block when the HDA PCM closes and a
# power-up block when it opens again, but the speaker calibration is only
# written when the DSP *configuration* changes (tasdevice_select_tuningprm_cfg,
# "Unneeded loading dsp conf"). So after the first close/open cycle -- e.g.
# restarting the browser -- the amps run uncalibrated and the bass is gone
# until the next boot. The codec also runtime-suspends on close.
#
# WirePlumber suspends an idle sink after 5 s, which closes the PCM. Keeping
# the speaker sink from suspending keeps the PCM open, so the close/open
# cycle never happens. Costs some battery (codec and DSP stay powered).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

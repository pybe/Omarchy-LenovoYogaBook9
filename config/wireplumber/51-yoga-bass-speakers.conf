# Lenovo Yoga Book 9 13IRU8: drive the bass speakers.
#
# The codec presents two speaker pins: 0x17 (tweeters, fed by DAC 0x03) and
# 0x14 (woofers, fed by DAC 0x02). The kernel classifies them as front and
# surround rather than tweeter and woofer, so a stereo stream only ever
# reaches DAC 0x03 and the woofers stay silent -- confirmed by muting the
# main speakers during playback and hearing nothing at all.
#
# Opening the sink as 4 channels puts audio on the surround pair too, and
# upmix generates that content from the stereo source.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        audio.channels = 4
        audio.position = [ FL, FR, RL, RR ]
        channelmix.upmix = true
        channelmix.upmix-method = psd
      }
    }
  }
]

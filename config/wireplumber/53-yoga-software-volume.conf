# The SOF UCM Speaker route changes only Speaker Playback Volume (DAC 0x03),
# leaving DAC2 (0x02) at 0 dB: at 10% the DACs differ by 60 dB.
# Scale the shared stereo stream instead, preserving the speaker balance.
# This is an ALSA device property; it also covers this card's other routes.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
